name: Build Immich Audio Android

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      build_number:
        required: true
        type: string
    secrets:
      AUDIO_ANDROID_KEYSTORE_BASE64:
        required: true
    outputs:
      artifact_name:
        description: Signed split APKs and verification manifest
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'qinggeng2015/immich'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_name: audio-android-apks
    env:
      AUDIO_BUILD_NUMBER: ${{ inputs.build_number }}
      ALIAS: androiddebugkey
      ANDROID_KEY_PASSWORD: android
      ANDROID_STORE_PASSWORD: android
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install native code generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libclang-dev

      - name: Set up pinned build tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.5
          working_directory: mobile
          install_args: --locked node pnpm java rust aqua:flutter/flutter npm:@openapitools/openapi-generator-cli
          github_token: ${{ github.token }}
          cache_key_prefix: audio-android-mise

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools build-tools;36.0.0 platforms;android-36
          log-accepted-android-sdk-licenses: false

      - name: Restore dependency caches
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
          key: audio-android-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'native/Cargo.lock', 'mobile/android/gradle/libs.versions.toml', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: audio-android-${{ runner.os }}-

      - name: Restore existing application signing key
        env:
          AUDIO_ANDROID_KEYSTORE_BASE64: ${{ secrets.AUDIO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AUDIO_ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$AUDIO_ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/key.jks
          test -s mobile/android/key.jks

      - name: Install dependencies
        run: |
          mise //mobile:install:release-tools
          mise //mobile:install:ci

      - name: Generate application code
        run: mise //mobile:codegen

      - name: Analyze Dart sources
        run: mise //mobile:analyze:dart

      - name: Build signed split APKs
        run: mise //mobile:build:android:release-apks

      - name: Verify identity, signatures, versions and checksums
        run: mise //mobile:verify:android:release-apks

      - name: Upload installable APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audio-android-apks
          path: mobile/build/release-apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save dependency caches
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Remove signing material
        if: always()
        run: rm -f mobile/android/key.jks
