name: Immich Audio CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: audio-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    if: github.repository == 'qinggeng2015/immich'
    uses: ./.github/workflows/fork-checks.yml
    with:
      ref: ${{ github.sha }}
      base_ref: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
